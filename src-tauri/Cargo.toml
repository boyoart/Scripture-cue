[package]
name = "scripture-cue"
version = "0.2.0"
description = "Scripture Cue desktop operator console"
authors = ["Scripture Cue Team"]
license = "Proprietary"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
