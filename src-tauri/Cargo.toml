[package]
name = "scripture-cue"
version = "0.2.0"
description = "Scripture Cue desktop shell"
authors = ["Scripture Cue Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1.6", features = ["clipboard-write-text", "dialog-open", "dialog-save", "fs-write-file"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
